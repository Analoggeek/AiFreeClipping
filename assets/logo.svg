      <rect x="34" y="34" width="188" height="34" rx="9" fill="url(#body)" stroke="url(#neon)" stroke-width="2"/>
      <g fill="url(#bar)" opacity="0.92">
        <path d="M54 35h30l-9 32H45z"/><path d="M104 35h30l-9 32H95z"/>
        <path d="M154 35h30l-9 32h-30z"/><path d="M204 35h14l-9 32h-14z"/>
      </g>
      <circle cx="52" cy="51" r="4" fill="#d8e8ff" opacity="0.8"/>
    </g>
    <rect x="28" y="72" width="200" height="154" rx="20" fill="url(#body)" stroke="url(#neon)" stroke-width="3"/>
    <rect x="38" y="82" width="180" height="134" rx="14" fill="#060a17" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="128" cy="149" r="56" fill="none" stroke="url(#neon)" stroke-width="7" filter="url(#glow)"/>
    <circle cx="128" cy="149" r="43" fill="none" stroke="#9fb4ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M109 124 L164 149 L109 174 Z" fill="url(#neon)" filter="url(#glow)"/>
