<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Clipper Pro</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      background: radial-gradient(circle at 50% 20%, #1c1740 0%, #090b14 55%);
      color: #e9ecff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
    }
    .box { text-align: center; }
    .mark {
      display: block; width: 84px; height: 84px; margin: 0 auto 18px;
      object-fit: contain; filter: drop-shadow(0 18px 34px rgba(139,92,246,.42));
      animation: breathe 2.2s ease-in-out infinite;
    }
    h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: .2px; }
    .made { color: #8f98bd; font-size: 10px; letter-spacing: 2px; margin-bottom: 26px; }
    .bar { width: 260px; height: 4px; border-radius: 4px; background: #232a45; overflow: hidden; margin: 0 auto 16px; }
    .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #8b5cf6, #22d3ee); animation: slide 1.3s ease-in-out infinite; }
    .status { font-size: 12px; color: #c9d0ef; }
    .detail { font-size: 11px; color: #79819f; margin-top: 6px; min-height: 14px; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @keyframes breathe { 50% { transform: translateY(-4px) scale(1.03); } }
  </style>
</head>
<body>
  <div class="box">
    <img class="mark" src="../brand/logo-mark-3d.svg" alt="AI Clipper Pro logo" />
    <h1>AI Clipper Pro</h1>
    <div class="made">MADE BY ANALOGGEEK</div>
    <div class="bar"><i></i></div>
    <div class="status" id="status">Starting…</div>
    <div class="detail" id="detail"></div>
  </div>
  <script>
    window.desktop?.onBackendStatus?.(({ text, detail }) => {
      document.getElementById('status').textContent = text || 'Starting…';
      document.getElementById('detail').textContent = detail || '';
    });
  </script>
</body>
</html>
