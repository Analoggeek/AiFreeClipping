name: Diagnose release manifest

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read release metadata files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p /tmp/release-meta
          gh release download v5.0.0 --pattern 'SHA256SUMS.txt' --pattern 'manifest.json' -D /tmp/release-meta --clobber
          {
            echo '### SHA256SUMS.txt'
            cat /tmp/release-meta/SHA256SUMS.txt
            echo '### manifest.json'
            cat /tmp/release-meta/manifest.json
          } > /tmp/release-meta/report.md 2>&1
          gh pr comment 176 --body-file /tmp/release-meta/report.md || true
