name: Probe the Windows runner with the real script

on:
  workflow_dispatch:
  push:
    branches:
      - arena/probe-windows
    paths:
      - .github/workflows/probe-windows.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Check out the source again
        if: failure()
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the real dependency installer
        shell: bash
        continue-on-error: true
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install --upgrade pip --retries 10 --timeout 120
          python scripts/install_deps.py --build

      - name: Write the report
        if: always()
        shell: bash
        run: |
          mkdir -p build
          {
            echo "### the network"
            python -c "import urllib.request;print(urllib.request.urlopen('https://api.github.com',timeout=30).status)" 2>&1 || true
            python -c "import urllib.request;print(urllib.request.urlopen('https://pypi.org/simple/',timeout=30).status)" 2>&1 || true
            echo ""
            echo "### the proxy"
            echo "HTTP_PROXY=$HTTP_PROXY HTTPS_PROXY=$HTTPS_PROXY NO_PROXY=$NO_PROXY"
            python -c "import ssl;print(ssl.OPENSSL_VERSION)" 2>&1 || true
            python -c "import socket;print(socket.gethostbyname('api.github.com'))" 2>&1 || true
            echo ""
            echo "### pip-install.log"
            tail -c 8000 build/pip-install.log 2>/dev/null || echo "(no pip log)"
            echo ""
            echo "### build-error.log"
            tail -c 4000 build/build-error.log 2>/dev/null || echo "(no error log)"
          } > build/probe-report.md 2>&1 || true
          echo "report written"

      - name: Post the report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '(no report)';
            for (const name of ['build/probe-report.md', 'build/pip-install.log',
                                'build/build-error.log']) {
              try {
                body += '\n### ' + name + '\n\n' + fs.readFileSync(name, 'utf8');
              } catch (e) {
                body += '\n### ' + name + '\n\n(missing)';
              }
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Windows probe report',
              body: body.slice(0, 60000),
            });

      - name: Fail at the end
        if: always()
        run: echo "probe finished"
