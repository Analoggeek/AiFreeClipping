name: Probe Windows with the exact build step

on:
  workflow_dispatch:
  push:
    branches:
      - arena/probe-windows
    paths:
      - .github/workflows/probe-windows.yml

permissions:
  contents: read
  issues: write

jobs:
  probe:
    name: Probe
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      INSTALL_DEPS_ARGS: --no-opencv
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Check out the source again
        if: failure()
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Upgrade pip
        shell: bash
        continue-on-error: true
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install --upgrade pip --retries 10 --timeout 120
      - name: Install dependencies
        shell: bash
        continue-on-error: true
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "### install attempt $attempt"
            if python scripts/install_deps.py --build $INSTALL_DEPS_ARGS; then
              exit 0
            fi
            echo "### attempt $attempt failed; waiting before trying again"
            sleep 20
          done
          echo "### the dependencies could not be installed" >&2
          exit 1
      - name: Write the report
        if: always()
        shell: bash
        run: |
          mkdir -p build
          {
            echo "### pip-install.log"
            tail -c 10000 build/pip-install.log 2>/dev/null || echo "(no pip log)"
            echo ""
            echo "### build-error.log"
            tail -c 5000 build/build-error.log 2>/dev/null || echo "(no error log)"
          } > build/probe-report.md 2>&1 || true
      - name: Post the report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '(no report)';
            for (const n of ['build/probe-report.md', 'build/pip-install.log', 'build/build-error.log']) {
              try { body += '\n### ' + n + '\n\n' + fs.readFileSync(n, 'utf8'); }
              catch (e) { body += '\n### ' + n + '\n\n(missing)'; }
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Windows probe report', body: body.slice(0, 60000),
            });
