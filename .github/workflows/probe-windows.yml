name: Probe the Windows runner with the real script

on:
  workflow_dispatch:
  push:
    branches:
      - arena/probe-windows
    paths:
      - .github/workflows/probe-windows.yml

jobs:
  probe:
    name: Probe
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Check out the source again
        if: failure()
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the real dependency installer
        shell: bash
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "### attempt $attempt"
            if python -m pip install --upgrade pip --retries 10 --timeout 120 \
               && python scripts/install_deps.py --build; then
              echo "### the installer worked"
              exit 0
            fi
            echo "### attempt $attempt failed"
            sleep 10
          done
          echo "### the installer failed" >&2
          {
            echo "### build/pip-install.log"
            echo ""
            tail -c 8000 build/pip-install.log 2>/dev/null || echo "(no pip log)"
            echo ""
            echo "### build/build-error.log"
            echo ""
            tail -c 4000 build/build-error.log 2>/dev/null || echo "(no error log)"
          } > build/probe-report.md 2>&1 || true
          cat build/probe-report.md
          exit 1
      - name: Post what happened
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '(no report)';
            try {
              body = fs.readFileSync('build/probe-report.md', 'utf8');
            } catch (e) {
              body = 'the report could not be read: ' + e.message;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Windows probe report',
              body: body.slice(0, 60000),
            });
