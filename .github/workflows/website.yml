name: Website and README checks
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/test_website.py"
      - "tests/test_website.py"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/test_website.py"
      - "tests/test_website.py"
      - ".github/workflows/website.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Responsive website and accessibility
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          python -m pip install pytest playwright==1.65.2
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/website-axe" axe-core@4.14.1 --no-audit --no-fund
          echo "AXE_SCRIPT=$RUNNER_TEMP/website-axe/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"
      - name: Validate the published-content contracts
        run: python -m pytest tests/test_website.py -q
      - name: Exercise the real website in Chromium
        run: python scripts/test_website.py
      - name: Retain desktop and mobile captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-captures
          path: artifacts/website/
          if-no-files-found: ignore
