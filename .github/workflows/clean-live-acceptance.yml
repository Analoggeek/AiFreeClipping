name: Clean clipping live Ollama weight acceptance
on:
  push:
    branches: [arena/b6de10fc-aifreeclipping]
    paths: ['.github/workflows/clean-live-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clean-live-acceptance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  actual-weights:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OLLAMA_HOST: '127.0.0.1:11434'
      OLLAMA_MODELS: /tmp/clipos-acceptance-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only CPU acceptance prerequisites
        run: python -m pip install psutil numpy
      - name: Verify and unpack official Linux runtime (not a Windows/macOS installer test)
        run: |
          curl --fail --location --retry 3 https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          echo 'b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf  /tmp/ollama.tar.zst' | sha256sum --check
          mkdir /tmp/clipos-ollama
          tar --zstd --exclude='*/cuda*' --exclude='*/vulkan*' --exclude='*/rocm*' -xf /tmp/ollama.tar.zst -C /tmp/clipos-ollama
          rm /tmp/ollama.tar.zst
      - name: Start actual local API and pull/test Qwen then Gemma 7B
        run: |
          export PATH="/tmp/clipos-ollama/bin:$PATH"
          python - <<'PY' > live-acceptance.txt
          import json,os,tempfile
          from pathlib import Path
          from clipos.core.ollama_install import start_service
          from clipos.ai.model_manager import ModelManager
          from clipos.ai.gemma_runtime import GemmaRuntime
          from clipos.db.database import Database
          print('Actual Linux runtime API:',start_service(),flush=True)
          with tempfile.TemporaryDirectory() as folder:
              path=Path(folder)/'model-registry.db';db=Database(path);manager=ModelManager(db)
              for tag in ('qwen2.5:0.5b','gemma:7b'):
                  def progress(state):
                      if state.get('status') in ('success','verifying sha256 digest','writing manifest'):print(tag,state,flush=True)
                  result=manager.pull_ollama(tag,consent=True,progress=progress)
                  print(tag,'ACTUAL PULL + LOCAL GGUF + INFERENCE:',result,flush=True)
                  print('Actual metadata:',GemmaRuntime().client.require_local_model(tag).get('details'),flush=True)
                  GemmaRuntime().unload(tag)
              before=manager.registry();db.close();db=Database(path)
              assert ModelManager(db).registry()==before
              print('Registry survives actual database reopen:',list(before),flush=True)
              db.close()
          print('Not tested by this Linux run: interactive Windows/macOS Ollama installation, physical-device quality.',flush=True)
          PY
          cat live-acceptance.txt
      - name: Record actual results (including failures)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f live-acceptance.txt ]; then
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(tail -c 12000 live-acceptance.txt)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-ollama-acceptance
          path: live-acceptance.txt
