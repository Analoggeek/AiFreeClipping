name: Build installers

# Builds the native installers on the operating systems they target:
#   - Windows  -> dist/CLIPOS-Setup.exe   (Inno Setup, a genuine installer)
#   - macOS    -> dist/CLIPOS.app + dist/CLIPOS-<version>.dmg
#
# The artifacts are attached to every release and can be downloaded straight
# from the Releases page.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the installer"
        required: false
        default: ""

permissions:
  contents: read
  issues: write        # so a build failure can report itself

# One build at a time.  Several queued runs compete for the runner pool and
# the ones that lose get cancelled -- which is how the macOS jobs kept
# disappearing.
concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python scripts/install_deps.py --build

      - name: Fetch the native binaries
        shell: bash
        run: python scripts/vendor_ffmpeg.py

      - name: Run the end-to-end test
        shell: bash
        run: python scripts/e2e_test.py

      - name: Install Inno Setup
        shell: bash
        run: |
          # Pinned: the "latest" package has moved between Inno 5 and 6
          # over the years, and Inno 5 does not understand the
          # ArchitecturesAllowed directive at all.
          choco install innosetup --version=6.4.0 --no-progress -y --allow-downgrade
          # Chocolatey does not always refresh PATH for the current
          # session, so the compiler is put on PATH explicitly.
          for d in "/c/Program Files (x86)/Inno Setup 6" "/c/Program Files/Inno Setup 6"; do
            if [ -d "$d" ]; then
              echo "$d" >> "$GITHUB_PATH"
              break
            fi
          done
          echo "iscc: $(which iscc || echo 'not on PATH')"

      - name: Report the free disk space
        shell: bash
        run: |
          echo "### Free disk space before the build"
          df -h . /c 2>&1 | head -5 || df -h . 2>&1 | head -5

      - name: Build the installer
        shell: bash
        run: python scripts/build.py windows --skip-tests --skip-vendor

      - name: Show what failed
        if: failure()
        shell: bash
        run: |
          echo "### Build failure details"
          echo ""
          echo "The build directory contains:"
          ls -la build 2>&1 | head -30
          echo ""
          for f in build/build-error.log build/pyinstaller.log build/*.iss build/*.nsi; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              head -c 4000 "$f"
              echo
            fi
          done
          echo "--- end of the build directory ---"
          echo ""
          echo "### Disk space"
          df -h . 2>&1 | head -5
          echo ""
          {
            echo "### Build failure details"
            echo ""
            echo '```'
            ls -la build 2>&1 | head -30
            echo ""
            for f in build/build-error.log build/pyinstaller.log build/*.iss build/*.nsi; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                head -c 4000 "$f"
                echo
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Report the failure to the repository
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/report_diag.py

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact || 'windows' }}
          path: |
            build/build-error.log
            build/pyinstaller.log
            build/CLIPOS/warn-CLIPOS.txt
            build/*.iss
            build/*.nsi
          if-no-files-found: ignore

      - name: Verify the frozen bundle
        shell: bash
        run: python scripts/verify_bundle.py dist

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: clipos-windows
          path: |
            dist/CLIPOS-Setup.exe
          if-no-files-found: error
  macos:
    name: macOS app and disk image
    # Only one macOS runner is needed.  The Intel build is produced on the
    # same machine by cross-compiling, so the release does not depend on a
    # second macOS runner being free at the same time -- which is what kept
    # cancelling the build.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/install_deps.py --build

      - name: Fetch the native binaries
        run: python scripts/vendor_ffmpeg.py

      - name: Run the end-to-end test
        run: python scripts/e2e_test.py

      - name: Build the application and the disk image
        run: python scripts/build.py macos --skip-tests --skip-vendor

      - name: Verify the frozen bundle
        run: python scripts/verify_bundle.py dist

      - name: Build the Intel application
        # PyInstaller cross-compiles a second, Intel build on the same
        # runner, so one macOS machine produces both applications.
        run: |
          python scripts/build.py macos --skip-tests --skip-vendor --target-arch x86_64
          mv dist/CLIPOS.app dist/CLIPOS-intel.app
          ls -la dist/

      - name: Upload the application and the disk image
        uses: actions/upload-artifact@v4
        with:
          name: clipos-macos
          path: |
            dist/CLIPOS.app
            dist/CLIPOS-*.dmg
            dist/CLIPOS-intel.app
          if-no-files-found: error

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/install_deps.py --build

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libpython3.11 libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Fetch the native binaries
        run: python scripts/vendor_ffmpeg.py

      - name: Build the GL stubs for the headless runner
        # The runner has no display, so Qt needs stub libraries for the
        # desktop libraries it links against.  They are only needed to run
        # the app on a headless machine; a real desktop has the real ones.
        run: python scripts/build_gl_stubs.py

      - name: Run the end-to-end test
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          export LD_LIBRARY_PATH="$PWD/.stublibs:${LD_LIBRARY_PATH:-}"
          python scripts/e2e_test.py

      - name: Build the package
        env:
          QT_QPA_PLATFORM: minimal
        run: |
          export LD_LIBRARY_PATH="$PWD/.stublibs:${LD_LIBRARY_PATH:-}"
          python scripts/build.py linux --skip-tests --skip-vendor

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: clipos-linux
          path: |
            dist/CLIPOS_*.deb
            dist/CLIPOS-*.zip
          if-no-files-found: error
