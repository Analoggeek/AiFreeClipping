name: Probe macOS runner

# A tiny workflow used to check whether a macOS runner can be reached at
# all.  The macOS build was being cancelled before a runner was assigned,
# and this tells us whether that is the runner pool or our own workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - arena/probe-macos
    paths:
      - .github/workflows/probe-macos.yml

jobs:
  probe:
    name: Probe ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, macos-12]
    steps:
      - name: Report the machine
        run: |
          echo "uname: $(uname -a)"
          echo "arch: $(uname -m)"
          echo "sw_vers: $(sw_vers 2>/dev/null | tr '\n' ' ')"
          python3 --version 2>/dev/null || true
