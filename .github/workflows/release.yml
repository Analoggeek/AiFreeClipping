name: Release offline installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 5.2.5)'
        required: true
        default: '5.2.5'
      only_platform:
        description: 'Build only one platform (leave all for the full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - mac
          - linux
      publish_from_runs:
        description: 'Comma-separated run IDs to publish (skips builds, e.g. 123,456)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve build matrix
    if: ${{ inputs.publish_from_runs == '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          ALL='{"include":[{"os":"windows-latest","platform":"win","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"arm64"},{"os":"macos-15-intel","platform":"mac","arch":"x64"},{"os":"macos-15","platform":"mac","arch":"arm64"},{"os":"ubuntu-24.04","platform":"linux","arch":"x64"}]}'
          FILTER="${{ inputs.only_platform }}"
          if [ -z "$FILTER" ] || [ "$FILTER" = "all" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$ALL" | jq -c --arg f "$FILTER" '.include |= map(select(.platform == $f))')" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.publish_from_runs == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python engine dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Generate platform icons
        run: python scripts/generate-icons.py

      - name: Bundle local Python engine + ffmpeg
        shell: bash
        run: python scripts/package-backend.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build React UI
        run: npm run build

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify Windows installer PE signature
        if: matrix.platform == 'win'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          EXE="release/AI-Clipper-Pro-${VERSION}-Windows-${{ matrix.arch }}.exe"
          test -s "$EXE"
          python - "$EXE" "${{ matrix.arch }}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          arch = sys.argv[2]
          with path.open("rb") as stream:
              dos_header = stream.read(64)
              if dos_header[:2] != b"MZ":
                  raise SystemExit(f"{path.name} is not a Windows PE executable")
              pe_offset = int.from_bytes(dos_header[0x3C:0x40], "little")
              stream.seek(pe_offset)
              pe_header = stream.read(6)
          if pe_header[:4] != b"PE\0\0":
              raise SystemExit(f"{path.name} has no valid PE signature")
          print(f"Verified Windows PE installer ({arch} payload target): {path.name}")
          PY

      - name: Verify Linux installer formats
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          APPIMAGE="release/AI-Clipper-Pro-${VERSION}-Linux-x86_64.AppImage"
          DEB="release/AI-Clipper-Pro-${VERSION}-Linux-amd64.deb"
          test -s "$APPIMAGE"
          test -s "$DEB"
          python - "$APPIMAGE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              magic = stream.read(4)
          if magic != b"\x7fELF":
              raise SystemExit(f"{path.name} is not an ELF AppImage")
          print(f"Verified AppImage ELF header: {path.name}")
          PY
          dpkg-deb --info "$DEB" >/dev/null
          test "$(dpkg-deb -f "$DEB" Architecture)" = "amd64"
          echo "Verified Debian package: $DEB"

      - name: Verify macOS DMG and ZIP
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="locating the macOS DMG and ZIP"
          DMG="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          ZIP="$(find release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -s "$DMG"
          test -s "$ZIP"
          echo "Verifying image: $DMG"
          IMAGE_INFO="$(hdiutil imageinfo "$DMG")"
          printf '%s\n' "$IMAGE_INFO"
          if ! printf '%s\n' "$IMAGE_INFO" | grep -q 'UDRO'; then
            echo "Expected read-only uncompressed UDRO image" >&2
            exit 1
          fi
          hdiutil verify "$DMG"
          MOUNT="$(mktemp -d /tmp/aifreeclip-dmg.XXXXXX)"
          COPY="$(mktemp -d /tmp/aifreeclip-copy.XXXXXX)"
          ZIP_COPY="$(mktemp -d /tmp/aifreeclip-zip.XXXXXX)"
          cleanup() {
            hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true
            rm -rf "$MOUNT" "$COPY" "$ZIP_COPY"
          }
          report_failure() {
            local status="$?"
            if [ "$status" -ne 0 ]; then
              echo "::error title=macOS artifact verification failed::$STAGE (exit $status)"
              if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
                printf '## macOS artifact verification failed\n\nStage: `%s` (exit %s)\n' "$STAGE" "$status" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
            cleanup
            return "$status"
          }
          trap report_failure EXIT
          EXPECTED_ARCH="${{ matrix.arch }}"
          if [ "$EXPECTED_ARCH" = "x64" ]; then EXPECTED_ARCH="x86_64"; fi
          verify_electron_framework() {
            local app="$1"
            local framework="$app/Contents/Frameworks/Electron Framework.framework/Electron Framework"
            local executable
            if [ ! -s "$framework" ]; then
              echo "Electron Framework is missing from $(basename "$app")" >&2
              exit 1
            fi
            executable="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x -print -quit)"
            if [ -z "$executable" ]; then
              echo "App bundle has no executable: $(basename "$app")" >&2
              exit 1
            fi
            lipo -verify_arch "$EXPECTED_ARCH" "$framework"
            lipo -verify_arch "$EXPECTED_ARCH" "$executable"
            if ! otool -L "$executable" | grep -E '@rpath/Electron Framework\.framework(/Versions/[^[:space:]/]+)?/Electron Framework([[:space:]]|$)' >/dev/null; then
              echo "App executable does not declare the expected Electron Framework load dependency" >&2
              exit 1
            fi
          }
          STAGE="mounting the DMG and locating the app bundle"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          APP="$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          STAGE="checking the DMG app's Electron Framework, load reference, and architecture"
          verify_electron_framework "$APP"
          # A failing ditto here is the exact failure that produces Finder error -36.
          STAGE="copying the DMG app bundle to local storage"
          ditto "$APP" "$COPY/$(basename "$APP")"
          COPY_APP="$COPY/$(basename "$APP")"
          STAGE="checking the copied DMG app's Electron Framework, load reference, and architecture"
          verify_electron_framework "$COPY_APP"
          test -n "$(find "$COPY_APP/Contents/MacOS" -type f -perm -u+x -print -quit)"
          if find "$COPY_APP" -name '._*' -o -name '.DS_Store' | grep -q .; then
            echo "Unexpected AppleDouble metadata inside verified copy" >&2
            exit 1
          fi
          STAGE="checking ZIP integrity and app executable path"
          unzip -tq "$ZIP"
          if ! unzip -Z1 "$ZIP" | grep -E 'app/Contents/MacOS/[^/]+$' >/dev/null; then
            echo "ZIP archive is missing its executable app bundle" >&2
            exit 1
          fi
          STAGE="extracting the ZIP app bundle"
          ditto -x -k "$ZIP" "$ZIP_COPY"
          ZIP_APP="$(find "$ZIP_COPY" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$ZIP_APP"
          STAGE="checking the ZIP app's Electron Framework, load reference, and architecture"
          verify_electron_framework "$ZIP_APP"
          test -n "$(find "$ZIP_APP/Contents/MacOS" -type f -perm -u+x -print -quit)"
          echo "macOS artifacts verified: UDRO DMG and ZIP contain a runnable app bundle with the correct Electron Framework."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifreeclip-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ (inputs.only_platform == '' || inputs.only_platform == 'all') && inputs.publish_from_runs == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums and manifest
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p release/installers
          find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -exec cp -f {} release/installers/ \;
          cd release/installers
          find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          printf '{"product":"AI Clipper Pro","author":"analoggeek","version":"%s","installers":%s}\n' \
            "$VERSION" "$(find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -printf '"%f",' | sed 's/,$//' | awk '{print "["$0"]"}')" > manifest.json
          ls -lh
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release create "v$VERSION" release/installers/* --target "$GITHUB_SHA" --notes-file docs/RELEASE_NOTES.md --title "AI Clipper Pro v$VERSION" || \
            (gh release upload "v$VERSION" release/installers/* --clobber && \
             gh release edit "v$VERSION" --notes-file docs/RELEASE_NOTES.md --title "AI Clipper Pro v$VERSION")

      - name: Verify published installer checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          VERIFY_DIR="release/verify-published-installers"
          mkdir -p "$VERIFY_DIR"
          gh release download "v$VERSION" --pattern 'AI-Clipper-Pro-*' --dir "$VERIFY_DIR"
          expected_count="$(awk 'END { print NR }' release/installers/SHA256SUMS.txt)"
          actual_count="$(find "$VERIFY_DIR" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          test "$expected_count" -gt 0
          test "$actual_count" = "$expected_count"
          for asset in "$VERIFY_DIR"/*; do
            name="$(basename "$asset")"
            expected="$(awk -v name="$name" '$2 == name || $2 == "./" name { print $1; exit }' release/installers/SHA256SUMS.txt)"
            actual="$(sha256sum "$asset" | awk '{ print $1 }')"
            test -n "$expected"
            if [ "$expected" != "$actual" ]; then
              echo "Published installer checksum mismatch: $name" >&2
              exit 1
            fi
            echo "Published installer checksum verified: $name"
          done

  publish_existing:
    name: Publish from existing runs
    if: ${{ inputs.publish_from_runs != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          mkdir -p release
          gh release create "v$VERSION" --notes-file docs/RELEASE_NOTES.md --title "AI Clipper Pro v$VERSION" || true
          gh release edit "v$VERSION" --notes-file docs/RELEASE_NOTES.md --title "AI Clipper Pro v$VERSION"
      - name: Download artifacts from selected runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release
          IFS=',' read -ra RUNS <<< "${{ inputs.publish_from_runs }}"
          for raw in "${RUNS[@]}"; do
            id="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$id" ] && continue
            echo "Downloading artifacts from run $id" | tee -a "$GITHUB_STEP_SUMMARY"
            gh run download "$id" -D "release/.run-$id" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          done
          mkdir -p release/installers
          find release/.run-* -mindepth 2 -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -exec cp -f {} release/installers/ \;
          find release -mindepth 1 -type d -name '.run-*' -exec rm -rf {} +
          ls -lh release/installers | tee -a "$GITHUB_STEP_SUMMARY"
          BODY="$(find release/installers -maxdepth 1 -type f -printf '%f %s bytes\n' | sort)"
          gh issue create --title "v5 release asset diagnostics (temporary)" --body "$BODY" >/dev/null || true
      - name: Checksums and manifest
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          cd release/installers
          find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          printf '{"product":"AI Clipper Pro","author":"analoggeek","version":"%s","installers":%s}\n' \
            "$VERSION" "$(find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -printf '"%f",' | sed 's/,$//' | awk '{print "["$0"]"}')" > manifest.json
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          for asset in release/installers/*; do
            echo "Uploading $(basename "$asset")" | tee -a "$GITHUB_STEP_SUMMARY"
            for attempt in 1 2 3; do
              if gh release upload "v$VERSION" "$asset" --clobber 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
                break
              fi
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
          done
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | tee -a "$GITHUB_STEP_SUMMARY"
