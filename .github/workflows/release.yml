name: Recover verified release publication
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45646294150
          path: artifacts
          merge-multiple: true
      - name: Verify and publish the already-built v3.6.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          names=(CLIPOS-Setup.exe CLIPOS-3.6.0-arm64.dmg CLIPOS-3.6.0-intel.dmg CLIPOS-arm64.app.tar.gz CLIPOS-intel.app.tar.gz CLIPOS_3.6.0_amd64.deb CLIPOS-3.6.0-linux-x86_64.zip)
          for name in "${names[@]}"; do
            mapfile -t paths < <(find artifacts -type f -name "$name")
            test "${#paths[@]}" = 1
            test -s "${paths[0]}"
            cp "${paths[0]}" "release-assets/$name"
          done
          # Keep the release draft until every expected uploaded asset exists.
          for name in "${names[@]}"; do
            ok=0
            for attempt in 1 2 3 4; do
              if gh release upload v3.6.0 "release-assets/$name" --clobber; then ok=1; break; fi
              sleep 15
            done
            test "$ok" = 1
          done
          gh release view v3.6.0 --json assets > assets.json
          python - <<'PY'
          import json
          assets=json.load(open('assets.json'))['assets']
          expected={'CLIPOS-Setup.exe','CLIPOS-3.6.0-arm64.dmg','CLIPOS-3.6.0-intel.dmg','CLIPOS-arm64.app.tar.gz','CLIPOS-intel.app.tar.gz','CLIPOS_3.6.0_amd64.deb','CLIPOS-3.6.0-linux-x86_64.zip'}
          assert {a['name'] for a in assets} == expected
          assert all(a['size']>0 for a in assets)
          PY
          gh api repos/Analoggeek/AiFreeClipping/contents/RELEASE_NOTES.md?ref=v3.6.0 --jq .content | base64 -d > release-notes.md
          gh release edit v3.6.0 --title 'Ai clipping PRO v3.6.0' --notes-file release-notes.md --draft=false --latest
