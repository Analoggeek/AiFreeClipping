name: Release offline installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 5.0.0)'
        required: true
        default: '5.0.0'
      only_platform:
        description: 'Build only one platform (leave all for the full matrix)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - mac
          - linux
      publish_from_runs:
        description: 'Comma-separated run IDs to publish (skips builds, e.g. 123,456)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve build matrix
    if: ${{ inputs.publish_from_runs == '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          ALL='{"include":[{"os":"windows-latest","platform":"win","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"arm64"},{"os":"macos-15-intel","platform":"mac","arch":"x64"},{"os":"macos-15","platform":"mac","arch":"arm64"},{"os":"ubuntu-24.04","platform":"linux","arch":"x64"}]}'
          FILTER="${{ inputs.only_platform }}"
          if [ -z "$FILTER" ] || [ "$FILTER" = "all" ]; then
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$ALL" | jq -c --arg f "$FILTER" '.include |= map(select(.platform == $f))')" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    if: ${{ inputs.publish_from_runs == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python engine dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Generate platform icons
        run: python scripts/generate-icons.py

      - name: Bundle local Python engine + ffmpeg
        shell: bash
        run: python scripts/package-backend.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build React UI
        run: npm run build

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifreeclip-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ (inputs.only_platform == '' || inputs.only_platform == 'all') && inputs.publish_from_runs == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums and manifest
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p release/installers
          find release -mindepth 2 -type f -name 'AI-Clipper-Pro-*' -exec cp -f {} release/installers/ \;
          cd release/installers
          find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          printf '{"product":"AI Clipper Pro","author":"analoggeek","version":"%s","installers":%s}\n' \
            "$VERSION" "$(find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -printf '"%f",' | sed 's/,$//' | awk '{print "["$0"]"}')" > manifest.json
          ls -lh
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release create "v$VERSION" release/installers/* --generate-notes --title "AI Clipper Pro v$VERSION" || \
            gh release upload "v$VERSION" release/installers/* --clobber

  publish_existing:
    name: Publish from existing runs
    if: ${{ inputs.publish_from_runs != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          mkdir -p release
          gh release create "v$VERSION" --notes-file docs/RELEASE_NOTES.md --title "AI Clipper Pro v$VERSION" || true
          gh release edit "v$VERSION" --notes-file docs/RELEASE_NOTES.md --title "AI Clipper Pro v$VERSION"
      - name: Download artifacts from selected runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p release
          IFS=',' read -ra RUNS <<< "${{ inputs.publish_from_runs }}"
          for raw in "${RUNS[@]}"; do
            id="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$id" ] && continue
            echo "Downloading artifacts from run $id" | tee -a "$GITHUB_STEP_SUMMARY"
            gh run download "$id" -D "release/.run-$id" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          done
          mkdir -p release/installers
          find release/.run-* -type f -name 'AI-Clipper-Pro-*' -exec cp -f {} release/installers/ \;
          find release -mindepth 1 -type d -name '.run-*' -exec rm -rf {} +
          ls -lh release/installers | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checksums and manifest
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          cd release/installers
          find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          printf '{"product":"AI Clipper Pro","author":"analoggeek","version":"%s","installers":%s}\n' \
            "$VERSION" "$(find . -maxdepth 1 -type f -name 'AI-Clipper-Pro-*' -printf '"%f",' | sed 's/,$//' | awk '{print "["$0"]"}')" > manifest.json
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          for asset in release/installers/*; do
            echo "Uploading $(basename "$asset")" | tee -a "$GITHUB_STEP_SUMMARY"
            for attempt in 1 2 3; do
              if gh release upload "v$VERSION" "$asset" --clobber 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"; then
                break
              fi
              [ "$attempt" = 3 ] && exit 1
              sleep 10
            done
          done
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | tee -a "$GITHUB_STEP_SUMMARY"
