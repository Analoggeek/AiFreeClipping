name: Release

# Publishes the native installers to a GitHub release.
#
# Push a tag that starts with "v" and the workflow builds the Windows
# installer, the macOS application and disk image, and the Linux package,
# then attaches them to the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for"
        required: true

permissions:
  contents: write
  issues: write        # so a build failure can report itself

# Only one release build at a time.  Without this, pushing a tag while an
# earlier run is still queued leaves several runs competing for the runner
# queue, and GitHub cancels the ones that lose -- which is exactly how the
# macOS jobs kept disappearing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      # A macOS runner is not always available straight away.  Retrying a
      # couple of times turns a cancelled job into a finished one.
      max-parallel: 2
      matrix:
        include:
          - name: Windows
            os: windows-2022
            artifact: clipos-windows
            files: |
              dist/CLIPOS-Setup.exe
          # Validate each architecture on its own CPU/OS runner. Rosetta can
          # pass a binary architecture check yet hang a real filter graph.
          - name: macOS Apple Silicon
            os: macos-15
            artifact: clipos-macos-arm64
            arch: arm64
            files: |
              dist/CLIPOS-arm64.app.tar.gz
              dist/CLIPOS-*-arm64.dmg
          - name: macOS Intel
            os: macos-15-intel
            artifact: clipos-macos-intel
            arch: x86_64
            files: |
              dist/CLIPOS-intel.app.tar.gz
              dist/CLIPOS-*-intel.dmg
          - name: Linux
            os: ubuntu-22.04
            artifact: clipos-linux
            files: |
              dist/CLIPOS_*.deb
              dist/CLIPOS-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # Windows has libGL, so the GUI build of OpenCV would work there.
      # The headless build is used anyway so the same package is installed
      # everywhere, and so OpenCV 5 never sneaks in.
      INSTALL_DEPS_ARGS: ${{ matrix.os == 'windows-2022' && '--no-opencv' || '' }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
        continue-on-error: true
      - name: Check out the source again
        # A flaky network on the runner must not throw away a build that
        # takes half an hour to produce.
        if: failure()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Python again
        # The tool cache download fails often enough to be worth a second
        # attempt before a half-hour build is thrown away.  The cache is
        # left out here: a cache that cannot be restored is not worth
        # losing the build over.
        if: failure()
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        shell: bash
        continue-on-error: true
        env:
          # The cache survives the step, so a partial download is not
          # started again from scratch.
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: python -m pip install --upgrade pip --retries 10 --timeout 120

      - name: Install dependencies
        shell: bash
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "### install attempt $attempt"
            if python scripts/install_deps.py --build --tracking $INSTALL_DEPS_ARGS; then
              exit 0
            fi
            echo "### attempt $attempt failed; waiting before trying again"
            sleep 20
          done
          echo "### the dependencies could not be installed" >&2
          exit 1

      - name: Install the platform build tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Pinned: the "latest" package has moved between Inno 5 and 6
            # over the years, and Inno 5 does not understand the
            # ArchitecturesAllowed directive at all.
            choco install innosetup --version=6.4.0 --no-progress -y --allow-downgrade
            # Chocolatey does not always refresh PATH for the current
            # session, so the compiler is put on PATH explicitly.
            for d in "/c/Program Files (x86)/Inno Setup 6" "/c/Program Files/Inno Setup 6"; do
              if [ -d "$d" ]; then
                echo "$d" >> "$GITHUB_PATH"
                break
              fi
            done
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libpython3.11
          fi

      - name: Fetch the native binaries
        run: python scripts/vendor_ffmpeg.py

      - name: Build the GL stubs for the headless runner
        # The runner has no display, so Qt needs stub libraries for the
        # desktop libraries it links against.  They are only needed to run
        # the app on a headless machine; a real desktop has the real ones.
        if: runner.os == 'Linux'
        run: python scripts/build_gl_stubs.py

      - name: Verify editing, batch export and native architecture
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export QT_QPA_PLATFORM=minimal
            export LD_LIBRARY_PATH="$PWD/.stublibs:${LD_LIBRARY_PATH:-}"
          fi
          mkdir -p build
          set +e  # Preserve pytest exit while emitting bounded JUnit diagnostics.
          python -m pytest tests/test_gaming_v2.py tests/test_workflow_v25.py tests/test_workflow_v251.py tests/test_local_editing_agent.py tests/test_automatic_selection.py tests/test_tightening.py tests/test_longform_preferences.py tests/test_speaker_vision_intent.py tests/test_local_av_models.py tests/test_imported_layouts.py tests/test_platform_performance.py tests/test_performance_release.py tests/test_native_render_stability.py tests/test_gemma_director.py tests/test_pro_workspace.py tests/test_pro_customization.py tests/test_overlay_tracks.py tests/test_clip_queue.py tests/test_editing_preset.py tests/test_studio_captions.py tests/test_studio_batch.py tests/test_live_playback.py tests/test_creative_library.py tests/test_studio_ducking.py tests/test_studio_audio.py tests/test_studio_color.py tests/test_studio_graphics.py tests/test_studio_effects.py tests/test_studio_transitions.py tests/test_clean_clipping_ui.py tests/test_clean_model_manager.py tests/test_crop_config.py tests/test_dependency_arch.py tests/test_creator_workflows.py tests/test_timeline.py tests/test_timeline_recovery.py tests/test_timeline_history.py tests/test_animated_captions.py tests/test_audio_ducking.py tests/test_reference_enhancements.py tests/test_encoder_preflight.py tests/test_timeline_integrity.py tests/test_person_tracking.py tests/test_body_reframe.py tests/test_multitrack.py tests/test_graphical_multitrack.py tests/test_waveform.py tests/test_diarization.py -vv -o faulthandler_timeout=120 --junitxml=build/editing-tests.xml -q 2>&1 | tee build/editing-tests.log
          test_status="${PIPESTATUS[0]}"
          python scripts/report_test_failures.py build/editing-tests.xml
          exit "$test_status"

      - name: Run the end-to-end test
        shell: bash
        run: |
          # The headless settings are for Linux only.  On Windows the
          # "minimal" platform plugin stops OpenCV from opening a video,
          # so the test fails there.
          if [ "$RUNNER_OS" = "Linux" ]; then
            export QT_QPA_PLATFORM=minimal
            export LD_LIBRARY_PATH="$PWD/.stublibs:${LD_LIBRARY_PATH:-}"
          fi
          # The output is kept so that a failure can be read afterwards:
          # the CI log storage is not always reachable.
          mkdir -p build
          python scripts/e2e_test.py 2>&1 | tee build/e2e.log
          exit "${PIPESTATUS[0]}"

      - name: Report the free disk space
        shell: bash
        run: |
          echo "### Free disk space before the build"
          df -h . /c 2>&1 | head -5 || df -h . 2>&1 | head -5

      - name: Build Apple Silicon before changing Python
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          python scripts/build.py macos --skip-tests --skip-vendor --target-arch arm64
          mv dist/CLIPOS.app dist/CLIPOS-arm64.app
          python scripts/verify_bundle.py dist/CLIPOS-arm64.app

      - name: Set up the Intel Python
        # An Intel application needs an Intel Python: the extension
        # modules have to be compiled for the machine the application is
        # meant to run on.  A virtual environment made from the Apple
        # Silicon Python would still hold Apple Silicon wheels, so the
        # Intel interpreter itself is installed.
        if: matrix.arch == 'x86_64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install isolated Intel dependencies
        if: matrix.arch == 'x86_64'
        shell: bash
        run: bash scripts/setup_intel_python.sh

      - name: Verify editing under isolated Intel Python
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          mkdir -p build
          "$CLIPOS_INTEL_PYTHON" -c 'import platform; assert platform.machine() == "x86_64"'
          set +e  # Preserve pytest exit while emitting bounded JUnit diagnostics.
          "$CLIPOS_INTEL_PYTHON" -m pytest tests/test_gaming_v2.py tests/test_workflow_v25.py tests/test_workflow_v251.py tests/test_local_editing_agent.py tests/test_automatic_selection.py tests/test_tightening.py tests/test_longform_preferences.py tests/test_speaker_vision_intent.py tests/test_local_av_models.py tests/test_imported_layouts.py tests/test_platform_performance.py tests/test_performance_release.py tests/test_native_render_stability.py tests/test_gemma_director.py tests/test_pro_workspace.py tests/test_pro_customization.py tests/test_overlay_tracks.py tests/test_clip_queue.py tests/test_editing_preset.py tests/test_studio_captions.py tests/test_studio_batch.py tests/test_live_playback.py tests/test_creative_library.py tests/test_studio_ducking.py tests/test_studio_audio.py tests/test_studio_color.py tests/test_studio_graphics.py tests/test_studio_effects.py tests/test_studio_transitions.py tests/test_clean_clipping_ui.py tests/test_clean_model_manager.py tests/test_crop_config.py tests/test_dependency_arch.py tests/test_creator_workflows.py tests/test_timeline.py tests/test_timeline_recovery.py tests/test_timeline_history.py tests/test_animated_captions.py tests/test_audio_ducking.py tests/test_reference_enhancements.py tests/test_encoder_preflight.py tests/test_timeline_integrity.py tests/test_person_tracking.py tests/test_body_reframe.py tests/test_multitrack.py tests/test_graphical_multitrack.py tests/test_waveform.py tests/test_diarization.py -vv -o faulthandler_timeout=120 --junitxml=build/editing-tests-intel.xml -q 2>&1 | tee build/editing-tests-intel.log
          test_status="${PIPESTATUS[0]}"
          python scripts/report_test_failures.py build/editing-tests-intel.xml
          exit "$test_status"

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export QT_QPA_PLATFORM=minimal
            export LD_LIBRARY_PATH="$PWD/.stublibs:${LD_LIBRARY_PATH:-}"
          fi
          case "$RUNNER_OS" in
            Windows) python scripts/build.py windows --skip-tests --skip-vendor ;;
            Linux)   python scripts/build.py linux   --skip-tests --skip-vendor ;;
            *)
              if [ "${{ matrix.arch }}" = "x86_64" ]; then
                export CLIPOS_BUILD_PYTHON="$CLIPOS_INTEL_PYTHON"
                "$CLIPOS_BUILD_PYTHON" scripts/build.py macos --skip-tests --skip-vendor --target-arch x86_64
                mv dist/CLIPOS.app dist/CLIPOS-intel.app
              fi
              ls -la dist/
              ;;
          esac

      - name: Show what failed
        if: failure()
        shell: bash
        run: |
          echo "### Build failure details"
          echo ""
          echo "The build directory contains:"
          ls -la build 2>&1 | head -30
          echo ""
          for f in build/build-error.log build/pyinstaller.log build/pip-install.log build/step-failure.txt build/*.iss build/*.nsi; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              head -c 12000 "$f"
              echo
            fi
          done
          echo "--- end of the build directory ---"
          echo ""
          echo "### Disk space"
          df -h . 2>&1 | head -5
          echo ""
          {
            echo "### Build failure details"
            echo ""
            echo '```'
            ls -la build 2>&1 | head -30
            echo ""
            for f in build/build-error.log build/pyinstaller.log build/pip-install.log build/step-failure.txt build/*.iss build/*.nsi; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                head -c 4000 "$f"
                echo
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Write down what the runner said
        # The step messages are the only place a failing action explains
        # itself, and they are not always readable afterwards.
        if: failure()
        shell: bash
        run: |
          {
            echo "### The runner"
            uname -a
            python --version 2>&1 || true
            df -h . 2>&1 | head -3 || true
            echo ""
            echo "### The build directory"
            ls -la build 2>&1 | head -30
            echo ""
            echo "### The installers that were produced"
            ls -la dist 2>&1 | head -20
          } > build/step-failure.txt 2>&1 || true
          cat build/step-failure.txt

      - name: Report the failure to the repository
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/report_diag.py

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact || 'windows' }}
          path: |
            build/build-error.log
            build/pyinstaller.log
            build/pip-install.log
            build/step-failure.txt
            build/CLIPOS/warn-CLIPOS.txt
            build/*.iss
            build/*.nsi
          if-no-files-found: ignore

      - name: Verify the frozen bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LD_LIBRARY_PATH="$PWD/.stublibs:${LD_LIBRARY_PATH:-}"
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            for app in dist/CLIPOS-arm64.app dist/CLIPOS-intel.app; do
              [ -d "$app" ] || continue
              python scripts/verify_bundle.py "$app"
            done
          else
            python scripts/verify_bundle.py dist
          fi

      - name: Archive native app permissions and symlinks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ -d dist/CLIPOS-arm64.app ]; then
            tar -czf dist/CLIPOS-arm64.app.tar.gz -C dist CLIPOS-arm64.app
          fi
          if [ -d dist/CLIPOS-intel.app ]; then
            tar -czf dist/CLIPOS-intel.app.tar.gz -C dist CLIPOS-intel.app
          fi

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  retry:
    name: Retry the jobs that did not finish
    # A macOS runner is not always free, and GitHub cancels a job it cannot
    # schedule.  This reports which platforms still need a build so they
    # can be re-run on their own.
    needs: build
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Find the unfinished jobs
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const missing = response.data.jobs
              .filter(j => j.conclusion !== 'success')
              .map(j => j.name);
            core.setOutput('jobs', JSON.stringify(missing));
            core.info('Jobs to retry: ' + missing.join(', '));

      - name: Report which platforms are missing
        shell: bash
        env:
          JOBS: ${{ steps.find.outputs.jobs }}
        run: |
          echo "### Platforms that still need a build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$JOBS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run these jobs from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms to retry: $JOBS"

  publish:
    name: Attach the installers to the release
    needs: [build, retry]
    # Never publish a partial release as latest; all platforms must verify.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
        continue-on-error: true
      - name: Check out the source again
        # A flaky network on the runner must not throw away a build that
        # takes half an hour to produce.
        if: failure()
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what was built
        shell: bash
        run: |
          echo "### Installer files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find artifacts -maxdepth 2 -type f | sort | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Pack the applications into archives
        # An application bundle is a directory, and a directory cannot be
        # attached to a release.  Each one is packed into an archive, so
        # that only the finished installers are attached rather than every
        # file inside the bundle.
        shell: bash
        run: |
          set -e
          cd artifacts
          for app in CLIPOS-arm64.app CLIPOS-intel.app; do
            [ -d "$app" ] || continue
            echo "### packing $app"
            tar -czf "${app%.app}.app.tar.gz" "$app"
            rm -rf "$app"
          done
          cd ..
          find artifacts -maxdepth 1 -type f | sort | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require all seven nonempty versioned assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for asset in "CLIPOS-Setup.exe" "CLIPOS-$version-arm64.dmg" "CLIPOS-$version-intel.dmg" "CLIPOS-arm64.app.tar.gz" "CLIPOS-intel.app.tar.gz" "CLIPOS_${version}_amd64.deb" "CLIPOS-$version-linux-x86_64.zip"; do
            test -s "artifacts/$asset" || { echo "Missing/empty release asset: $asset"; exit 1; }
          done

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CLIPOS ${{ github.event.inputs.tag || github.ref_name }}
          # The release is made public here; it exists as a draft until
          # the installers are attached, so that a half-built release is
          # never visible.
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/**/CLIPOS-Setup.exe
            artifacts/**/CLIPOS-*.dmg
            artifacts/**/CLIPOS-arm64.app.tar.gz
            artifacts/**/CLIPOS-intel.app.tar.gz
            artifacts/**/CLIPOS_*.deb
            artifacts/**/CLIPOS-*.zip
          fail_on_unmatched_files: false
