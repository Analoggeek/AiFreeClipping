name: Release

# Publishes the native installers to a GitHub release.
#
# Push a tag that starts with "v" and the workflow builds the Windows
# installer, the macOS application and disk image, and the Linux package,
# then attaches them to the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for"
        required: true

permissions:
  contents: write
  issues: write        # so a build failure can report itself

# Only one release build at a time.  Without this, pushing a tag while an
# earlier run is still queued leaves several runs competing for the runner
# queue, and GitHub cancels the ones that lose -- which is exactly how the
# macOS jobs kept disappearing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      # A macOS runner is not always available straight away.  Retrying a
      # couple of times turns a cancelled job into a finished one.
      max-parallel: 2
      matrix:
        include:
          - name: Windows
            os: windows-2022
            artifact: clipos-windows
            files: |
              dist/CLIPOS-Setup.exe
          # One macOS runner builds both applications.  The Intel build is
          # cross-compiled on the same machine, so the release does not
          # need a second macOS runner to be free at the same time --
          # which is what kept cancelling the build.
          - name: macOS
            os: macos-14
            artifact: clipos-macos
            files: |
              dist/CLIPOS.app
              dist/CLIPOS-*.dmg
              dist/CLIPOS-intel.app
          - name: Linux
            os: ubuntu-22.04
            artifact: clipos-linux
            files: |
              dist/CLIPOS_*.deb
              dist/CLIPOS-*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Check out the source again
        # A flaky network on the runner must not throw away a build that
        # takes half an hour to produce.
        if: failure()
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Python again
        # The tool cache download fails often enough to be worth a second
        # attempt before a half-hour build is thrown away.  The cache is
        # left out here: a cache that cannot be restored is not worth
        # losing the build over.
        if: failure()
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/install_deps.py --build

      - name: Install the platform build tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Pinned: the "latest" package has moved between Inno 5 and 6
            # over the years, and Inno 5 does not understand the
            # ArchitecturesAllowed directive at all.
            choco install innosetup --version=6.4.0 --no-progress -y --allow-downgrade
            # Chocolatey does not always refresh PATH for the current
            # session, so the compiler is put on PATH explicitly.
            for d in "/c/Program Files (x86)/Inno Setup 6" "/c/Program Files/Inno Setup 6"; do
              if [ -d "$d" ]; then
                echo "$d" >> "$GITHUB_PATH"
                break
              fi
            done
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libpython3.11
          fi

      - name: Fetch the native binaries
        run: python scripts/vendor_ffmpeg.py

      - name: Run the end-to-end test
        run: python scripts/e2e_test.py

      - name: Report the free disk space
        shell: bash
        run: |
          echo "### Free disk space before the build"
          df -h . /c 2>&1 | head -5 || df -h . 2>&1 | head -5

      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) python scripts/build.py windows --skip-tests --skip-vendor ;;
            Linux)   python scripts/build.py linux   --skip-tests --skip-vendor ;;
            *)
              python scripts/build.py macos --skip-tests --skip-vendor
              # The Intel application is built on the same runner, so only
              # one macOS machine is needed for the whole release.
              python scripts/build.py macos --skip-tests --skip-vendor --target-arch x86_64
              mv dist/CLIPOS.app dist/CLIPOS-intel.app
              ls -la dist/
              ;;
          esac

      - name: Show what failed
        if: failure()
        shell: bash
        run: |
          echo "### Build failure details"
          echo ""
          echo "The build directory contains:"
          ls -la build 2>&1 | head -30
          echo ""
          for f in build/build-error.log build/pyinstaller.log build/*.iss build/*.nsi; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              head -c 12000 "$f"
              echo
            fi
          done
          echo "--- end of the build directory ---"
          echo ""
          echo "### Disk space"
          df -h . 2>&1 | head -5
          echo ""
          {
            echo "### Build failure details"
            echo ""
            echo '```'
            ls -la build 2>&1 | head -30
            echo ""
            for f in build/build-error.log build/pyinstaller.log build/*.iss build/*.nsi; do
              if [ -f "$f" ]; then
                echo "--- $f ---"
                head -c 4000 "$f"
                echo
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Report the failure to the repository
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/report_diag.py

      - name: Write down what the runner said
        # The step messages are the only place a failing action explains
        # itself, and they are not always readable afterwards.
        if: failure()
        shell: bash
        run: |
          {
            echo "### The steps that ran"
            echo ""
            for f in build/step-summary.txt; do
              [ -f "$f" ] && cat "$f"
            done
            echo ""
            echo "### The runner"
            uname -a
            python --version 2>&1 || true
            df -h . 2>&1 | head -3 || true
          } > build/step-failure.txt 2>&1 || true
          cat build/step-failure.txt

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.artifact || 'windows' }}
          path: |
            build/build-error.log
            build/pyinstaller.log
            build/CLIPOS/warn-CLIPOS.txt
            build/*.iss
            build/*.nsi
          if-no-files-found: ignore

      - name: Verify the frozen bundle
        run: python scripts/verify_bundle.py dist

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  retry:
    name: Retry the jobs that did not finish
    # A macOS runner is not always free, and GitHub cancels a job it cannot
    # schedule.  This reports which platforms still need a build so they
    # can be re-run on their own.
    needs: build
    if: always() && needs.build.result != 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Find the unfinished jobs
        id: find
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const missing = response.data.jobs
              .filter(j => j.conclusion !== 'success')
              .map(j => j.name);
            core.setOutput('jobs', JSON.stringify(missing));
            core.info('Jobs to retry: ' + missing.join(', '));

      - name: Report which platforms are missing
        env:
          JOBS: ${{ steps.find.outputs.jobs }}
        run: |
          echo "### Platforms that still need a build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$JOBS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Re-run these jobs from the Actions tab." >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms to retry: $JOBS"

  publish:
    name: Attach the installers to the release
    needs: [build, retry]
    # A cancelled macOS runner must not throw away the Windows and Linux
    # installers that did build.  Publish whatever is there.
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Check out the source again
        # A flaky network on the runner must not throw away a build that
        # takes half an hour to produce.
        if: failure()
        uses: actions/checkout@v4

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what was built
        run: |
          echo "### Installer files" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          find artifacts -type f | sort | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CLIPOS ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## CLIPOS — AI Automatic Video Clipping Studio

            Turn long videos into upload-ready shorts, entirely offline.

            | Platform | File | Install |
            |---|---|---|
            | Windows 10/11 | `CLIPOS-Setup.exe` | Run it. No admin rights needed. |
            | macOS (Apple Silicon) | `CLIPOS-*.dmg` | Drag CLIPOS into Applications. |
            | macOS (Intel) | `CLIPOS.app` | Drag CLIPOS into Applications. |
            | Linux | `CLIPOS_*.deb` | `sudo apt install ./CLIPOS_*.deb` |

            Every package is offline: it carries the application, the Python
            runtime, FFmpeg, the face-detection models and the sound effects.
            The only thing you download separately is the speech-to-text model
            (open **AI Models** in the app), after which the whole workflow
            runs without an internet connection.

          files: |
            artifacts/**/CLIPOS-Setup.exe
            artifacts/**/CLIPOS-*.dmg
            artifacts/**/CLIPOS.app/**
            artifacts/**/CLIPOS-intel.app/**
            artifacts/**/CLIPOS_*.deb
            artifacts/**/CLIPOS-*.zip
          fail_on_unmatched_files: false
