name: macOS packaging integrity

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/installer_macos.py'
      - 'scripts/build.py'
      - 'tests/test_macos_integrity.py'
      - '.github/workflows/macos-integrity.yml'
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: "Optional failed release run ID: recover its diagnostic artifact only"
        required: false
        default: ""

concurrency:
  group: macos-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  integrity:
    if: github.event.inputs.diagnostic_run == ''
    name: Native Intel and Apple Silicon signature and DMG checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify final seals, notarization commands and mounted images
        run: python3 -m unittest tests.test_macos_integrity -v

  recover-diagnostics:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.diagnostic_run != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-log-clipos-macos
          path: diagnostics
          run-id: ${{ inputs.diagnostic_run }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let body = 'Recovered diagnostic artifact for run ${{ inputs.diagnostic_run }}\n';
            function walk(dir) {
              for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else if (['build-error.log','step-failure.txt','failure-report.md'].includes(e.name)) {
                  const text = fs.readFileSync(p,'utf8');
                  body += '\n### ' + e.name + '\n```\n' + text.slice(0,10000) + '\n...tail...\n' + text.slice(-6000) + '\n```\n';
                }
              }
            }
            walk('diagnostics');
            await github.rest.issues.create({...context.repo, title:'Recovered macOS release diagnostics', body:body.slice(0,60000)});
