name: Intel engine audit
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/intel-engine-audit.yml"]
concurrency:
  group: intel-engine-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  audit:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install test dependencies
        run: |
          python scripts/install_deps.py
          python -m pip install pytest-timeout
      - name: Fetch verified engines
        run: python scripts/vendor_ffmpeg.py
      - name: Bounded native render tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          python scripts/audit_intel_music.py > native-tests.log 2>&1
          result=$?
          tail -c 55000 native-tests.log > report.log
          gh issue create --title "Bounded Intel render tests" --body-file report.log
          exit "$result"

# Compare finite demux loops against bounded audio-filter looping.
