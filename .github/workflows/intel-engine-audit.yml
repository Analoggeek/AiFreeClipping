name: Intel engine audit
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/intel-engine-audit.yml"]
concurrency:
  group: intel-engine-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  audit:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Preserve verbose native stall diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 45570139715 --job 139054488991 --log > previous.log
          tail -c 55000 previous.log > report.log
          gh issue create --title "Native full-suite Intel stall context" --body-file report.log
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install test dependencies
        run: |
          python scripts/install_deps.py
          python -m pip install pytest-timeout
      - name: Fetch verified engines
        run: python scripts/vendor_ffmpeg.py
      - name: Bounded native render tests
        env:
          QT_QPA_PLATFORM: minimal
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          python -m pytest tests/test_imported_layouts.py tests/test_native_render_stability.py -vv --timeout=120 -o faulthandler_timeout=90 > native-tests.log 2>&1
          result=$?
          tail -c 55000 native-tests.log > report.log
          gh issue create --title "Bounded Intel render tests" --body-file report.log
          exit "$result"
