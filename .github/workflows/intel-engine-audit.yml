name: Intel engine audit
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/intel-engine-audit.yml"]
concurrency:
  group: intel-engine-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  audit:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Preserve verbose native stall diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run view 45570139715 --job 139054488991 --log > previous.log 2>&1 || true
          tail -c 55000 previous.log > report.log
          gh issue create --title "Native full-suite Intel stall context" --body-file report.log
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install test dependencies
        run: |
          python scripts/install_deps.py
          python -m pip install pytest-timeout
      - name: Fetch verified engines
        run: python scripts/vendor_ffmpeg.py
      - name: Bounded native render tests
        env:
          QT_QPA_PLATFORM: minimal
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          python -m pytest tests/test_gaming_v2.py tests/test_workflow_v25.py tests/test_workflow_v251.py tests/test_local_editing_agent.py tests/test_automatic_selection.py tests/test_tightening.py tests/test_longform_preferences.py tests/test_speaker_vision_intent.py tests/test_local_av_models.py tests/test_imported_layouts.py tests/test_platform_performance.py tests/test_performance_release.py tests/test_native_render_stability.py tests/test_dependency_arch.py tests/test_creator_workflows.py tests/test_timeline.py tests/test_timeline_recovery.py tests/test_timeline_history.py tests/test_animated_captions.py tests/test_audio_ducking.py tests/test_reference_enhancements.py tests/test_encoder_preflight.py tests/test_timeline_integrity.py tests/test_person_tracking.py tests/test_body_reframe.py tests/test_multitrack.py tests/test_graphical_multitrack.py tests/test_waveform.py tests/test_diarization.py -vv --timeout=120 -o faulthandler_timeout=90 > native-tests.log 2>&1
          result=$?
          tail -c 55000 native-tests.log > report.log
          gh issue create --title "Bounded Intel render tests" --body-file report.log
          exit "$result"
